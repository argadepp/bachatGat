<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #6a11cb; /* Dark background */
            color: #f8f9fa; /* Light text for contrast */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #ffffff; /* Light background for the card */
            color: #212529; /* Dark text for the card */
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); /* Subtle shadow for the card */
            max-width: 500px; /* Increased width */
            width: 100%;
            padding: 15px; /* Reduced padding for shorter height */
        }
        .card-header {
            text-align: center;
            margin-bottom: 15px; /* Reduced margin for compact design */
        }
        a {
            color: #007bff; /* Bootstrap primary color for links */
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card bg-dark text-white" style="border-radius: 1rem;">
        <div class="card-body">
            <header class="card-header">
                <h1 class="h4 text-primary">Register</h1>
            </header>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="mb-4">
                        {% for category, message in messages %}
                            <div class="alert alert-{{ 'success' if category == 'message' else 'danger' }}" role="alert">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST" action="/register">
                <ul class="list-unstyled">
                    <li class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </li>
                    <li class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </li>
                    <li class="mb-3">
                        <label for="role" class="form-label">Role</label>
                        <select name="role" class="form-select" required>
                            <option value="admin">Admin</option>
                            <option value="member">Member</option>
                        </select>
                    </li>
                    <li class="text-center">
                        <button data-mdb-button-init data-mdb-ripple-init type="submit" class="btn btn-outline-light w-100">Register</button>
                    </li>
                </ul>
            </form>
            <p class="text-center mt-3">
                Already have an account? <a href="{{ url_for('login') }}" class="text-primary">Login</a>
            </p>
        </div>
    </div>
</body>
</html>
